component_type: Agent
id: "aic-mep-energy-sync-001"
name: "Energy Model Data Sync"
description: "Keeps EnergyPlus and eQUEST energy models synchronized with the live BIM model — detects envelope, occupancy, and mechanical system changes and propagates them to the energy simulation inputs."
metadata:
  category: "mechanical"
  github_url: "https://github.com/aic-consortium/energy-model-sync"
  maturity: "experimental"
  tags:
    - "energy-modeling"
    - "energyplus"
    - "bim"
    - "sustainability"
    - "mechanical"
system_prompt: "You are an energy model synchronization agent. Monitor the BIM model for changes to envelope assemblies, window-to-wall ratios, occupancy schedules, and HVAC system assignments. When changes are detected, update the corresponding EnergyPlus IDF or eQUEST INP input files, re-run the simulation, and report EUI delta against the baseline."
llm_config:
  name: "gpt-4o"
  default_generation_parameters:
    max_tokens: 3000
    temperature: 0.1
    top_p: 0.9
tools:
  - name: "diff_bim_snapshot"
    description: "Compares current BIM model snapshot to the last energy model sync checkpoint"
  - name: "update_idf_inputs"
    description: "Writes changed envelope and system parameters to an EnergyPlus IDF file"
  - name: "run_energy_simulation"
    description: "Executes an EnergyPlus or eQUEST simulation and returns the results"
  - name: "compute_eui_delta"
    description: "Calculates the change in Energy Use Intensity versus the approved baseline"
  - name: "post_simulation_report"
    description: "Posts a summary of simulation results to the project data environment"
human_in_the_loop: false
