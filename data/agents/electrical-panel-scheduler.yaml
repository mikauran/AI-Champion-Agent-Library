component_type: Agent
id: "aic-mep-panel-sched-001"
name: "Electrical Panel Scheduler"
description: "Generates and keeps electrical panel schedules synchronized with BIM model data — calculates connected loads, applies NEC demand factors, checks panel capacity, and exports schedules to design documents."
metadata:
  category: "electrical"
  github_url: "https://github.com/aic-consortium/electrical-panel-scheduler"
  maturity: "production"
  tags:
    - "electrical"
    - "panel-schedule"
    - "nec"
    - "load-calculation"
    - "bim"
system_prompt: "You are an electrical panel scheduling agent. Extract circuit data from BIM models, apply NEC 2023 demand factors for the load type (lighting, receptacles, HVAC, motors), calculate total connected and demand loads, check against panel ampacity, and flag overloaded panels. Export finalized schedules as structured data and PDF."
llm_config:
  name: "gpt-4o"
  default_generation_parameters:
    max_tokens: 2048
    temperature: 0.1
    top_p: 0.9
tools:
  - name: "extract_circuits"
    description: "Extracts circuit assignments and load data from a Revit electrical model"
  - name: "apply_demand_factors"
    description: "Applies NEC demand factors by load category to a circuit list"
  - name: "check_panel_capacity"
    description: "Compares calculated demand load against panel ampacity and main breaker rating"
  - name: "export_panel_schedule"
    description: "Exports the finalized panel schedule to a structured JSON file and a formatted PDF"
  - name: "create_design_issue"
    description: "Logs an overloaded panel or capacity warning as a design issue"
human_in_the_loop: true
