component_type: Agent
id: "aic-mep-rfi-triage-001"
name: "RFI Triage Assistant"
description: "Conversational agent that helps field coordinators draft, classify, and route MEP Requests for Information — asks clarifying questions, suggests likely responsible parties, and checks for related prior RFIs before submission."
metadata:
  category: "project-management"
  github_url: "https://github.com/aic-consortium/rfi-triage-assistant"
  maturity: "production"
  tags:
    - "rfi"
    - "coordination"
    - "chat"
    - "field-workflow"
    - "mep"
system_prompt: "You are an MEP RFI triage assistant. When a field coordinator describes an issue, ask targeted clarifying questions to determine the affected discipline (mechanical, electrical, plumbing, or fire protection), the relevant drawing and detail, the impact on schedule and adjacent trades, and the urgency. Search prior RFIs for duplicates or related issues. Suggest the most likely responsible design party based on the issue type. Help draft a concise, technically precise RFI description and route it to the correct reviewer."
llm_config:
  name: "claude-sonnet-4-6"
  default_generation_parameters:
    max_tokens: 2048
    temperature: 0.4
    top_p: 0.95
tools:
  - name: "search_prior_rfis"
    description: "Searches the project RFI log for issues matching keywords or drawing references"
  - name: "fetch_drawing_metadata"
    description: "Retrieves drawing title, revision, and responsible party for a given sheet number"
  - name: "classify_rfi"
    description: "Classifies an RFI by discipline, issue type, and urgency tier"
  - name: "submit_rfi"
    description: "Creates a new RFI record in the project management system and assigns it to the responsible reviewer"
human_in_the_loop: true
