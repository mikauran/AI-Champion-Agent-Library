component_type: Agent
id: "aic-mep-submittal-001"
name: "MEP Submittal Review Router"
description: "Receives product submittal packages, extracts performance data from spec sheets, compares values against design specifications, and routes to the responsible engineer with a pre-populated review checklist."
metadata:
  category: "project-management"
  github_url: "https://github.com/aic-consortium/mep-submittal-router"
  maturity: "beta"
  tags:
    - "submittal"
    - "document-management"
    - "workflow"
    - "mep"
    - "review"
system_prompt: "You are a submittal review routing agent for MEP projects. Parse incoming product submittal PDFs to extract key performance parameters (CFM, BTU, voltage, GPM, etc.). Compare extracted values against the project specification section for that product type. Identify compliant, non-compliant, and unverifiable parameters. Assign to the responsible discipline engineer with a pre-populated checklist and highlighted discrepancies."
llm_config:
  name: "claude-sonnet-4-6"
  default_generation_parameters:
    max_tokens: 4096
    temperature: 0.2
    top_p: 0.95
tools:
  - name: "parse_submittal_pdf"
    description: "Extracts product performance data from a submittal PDF using OCR and structured extraction"
  - name: "fetch_spec_section"
    description: "Retrieves the relevant specification section from the project document library"
  - name: "compare_to_spec"
    description: "Compares extracted product parameters against specification requirements"
  - name: "assign_review_task"
    description: "Creates a review task for the responsible engineer with checklist and flagged items"
  - name: "update_submittal_log"
    description: "Updates the project submittal log with current status and reviewer assignment"
human_in_the_loop: true
