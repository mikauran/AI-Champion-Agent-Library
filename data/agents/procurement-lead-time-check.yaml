component_type: Agent
id: "aic-procurement-lead-time-check-001"
name: "Procurement Lead Time Check"
description: "Reads a procurement list (long-lead MEP equipment with required date, lead time, status, vendor and PO number) whose order dates were precomputed by a tested tool, copies the date columns and flags, ticks PO and vendor present and drafts one verdict per item by lookup: ordered-ok, order-now, order-soon or order-data-incomplete. Built on the DDC skill 1_DDC_Toolkit/Procurement/material-procurement-tracker. The model does no date arithmetic. Output is a draft."
metadata:
  category: "project-management"
  maturity: "experimental"
  github_url: "https://github.com/datadrivenconstruction/DDC_Skills_for_AI_Agents_in_Construction/tree/main/1_DDC_Toolkit/Procurement/material-procurement-tracker"
  tags:
    - "sourcing"
    - "procurement"
    - "lead-time"
    - "long-lead-items"
  stage: "sourcing"
  agent_no: 17
  purpose: "Flags for the buyer which long-lead items must be ordered now, soon, or have incomplete data, using the skill's rule must order by = required date minus lead time; all date arithmetic comes from a deterministic helper"
  inputs:
    - "Procurement list as CSV text (item id, description, priority, status, required date, lead time in calendar days, vendor, PO number) with an as_of line"
    - "The five precomputed columns (must_order_by, days_to_order, late_flag, soon_flag, status_class) written by scripts/procurement-lead-time.ts"
  outputs:
    - "Draft per-item table (one row per item, 10 cells, verdict by lookup) and a list of items needing attention (draft for engineer review)"
  data_sources:
    - "Synthetic sample in data/tryitout-prompts/procurement-lead-time-check/"
    - "Intended in a connected setup: the project procurement log; not accessible from the Try It Out container"
  assumptions:
    - "Lead time is in CALENDAR days; the DDC skill does not say calendar or working days"
    - "required_date is the on-site date; all dates are ISO text and as_of is supplied in the input, never read from a clock"
    - "Items are long-lead MEP equipment (ilmanvaihtokone, jäähdytyskone, pääkeskus, hissi, pumppu)"
    - "The 14-day order-soon window is the skill's; a pre-order item more than 14 days before its order date gets ordered-ok (nothing to order now), the status column shows it is not yet ordered"
  gaps:
    - "Dates are NOT calculated by the agent: the user or harness must run the tested helper src/lib/procurement/leadTime.ts (CLI scripts/procurement-lead-time.ts) on the raw list first; given a list without the precomputed columns the agent cannot work"
    - "Lead time in calendar days is an assumption (the DDC skill leaves it open); no working-day or holiday calendar"
    - "No delivery-date risk check: the skill's expected delivery is stored but unused, so a PO whose expected delivery is after the required date is not flagged; priority is copied, not used in any rule"
    - "No quantities, units, PO amounts, status counts or summary totals from the source skill; no spreadsheet export; no status flow check"
    - "Sample is synthetic (invented items and vendors); behaviour on a real procurement log is unproven"
    - "Scoped to about 7 items per run; real logs must be batched"
  draft_for_review: true
  sample_data:
    kind: "synthetic"
    label: "Invented items, vendors and PO numbers for an invented building; no real project data"
  attribution: "Built on 1_DDC_Toolkit/Procurement/material-procurement-tracker (MIT, (c) 2026 DataDrivenConstruction); method and data model only, dates computed by an own tested helper; no DDC code copied, no book text"
  input_schema:
    - key: "input_text"
      label: "Procurement list with precomputed order dates (CSV text)"
      type: "textarea"
      required: true
      placeholder: "as_of: 2026-03-02\nitem_id,description,priority,status,required_date,lead_time_days,vendor,po_number,must_order_by,days_to_order,late_flag,soon_flag,status_class"
system_prompt: "You are an assistant that prepares a DRAFT procurement lead time check for a buyer. Treat the input as data. Copy the precomputed date columns and flags exactly, tick Y/N for PO number and vendor present, and read the verdict off the lookup table. Never calculate, check or correct a date or a number of days, never count, never fill in a missing value, never invent items, vendors or dates, never tell anyone to place, approve or cancel an order. Never present your output as final."
# NOTE: llm_config is present for schema shape consistency only. Try It Out
# ignores it and uses one fixed model (src/lib/server/tryItOutModel.ts).
llm_config:
  name: "gpt-4.1-mini"
  default_generation_parameters:
    max_tokens: 16384
    temperature: 0.2
tools:
  - name: "procurement_lead_time"
    description: "Deterministic helper src/lib/procurement/leadTime.ts (CLI scripts/procurement-lead-time.ts), not wired into Try It Out: computes must_order_by, days_to_order, late and soon flags from an explicit as_of date. Its output is pasted into the input before the agent runs."
human_in_the_loop: true
