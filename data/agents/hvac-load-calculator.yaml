component_type: Agent
id: "aic-mep-hvac-load-001"
name: "HVAC Load Calculator"
description: "Automates ASHRAE 62.1 and Manual J load calculations by extracting zone geometry and occupancy data from BIM models, running calculations, and writing results back to the project data environment."
metadata:
  category: "mechanical"
  github_url: "https://github.com/aic-consortium/hvac-load-calculator"
  maturity: "production"
  tags:
    - "hvac"
    - "load-calculation"
    - "ashrae"
    - "bim"
    - "mechanical"
system_prompt: "You are an HVAC load calculation agent. Extract zone geometry, envelope properties, and occupancy schedules from BIM data. Run ASHRAE 62.1 ventilation and Manual J heating/cooling load calculations. Flag zones that exceed design tolerances and write results to the project data environment."
llm_config:
  name: "claude-sonnet-4-6"
  default_generation_parameters:
    max_tokens: 4096
    temperature: 0.1
    top_p: 0.95
tools:
  - name: "extract_bim_zones"
    description: "Pulls zone geometry and envelope data from a Revit or IFC model"
  - name: "fetch_occupancy_schedule"
    description: "Retrieves occupancy and equipment heat gain schedules for a zone"
  - name: "run_load_calculation"
    description: "Executes ASHRAE 62.1 ventilation or Manual J heating/cooling calculation for a zone set"
  - name: "write_load_report"
    description: "Writes calculation results to the project data environment and generates a PDF summary"
  - name: "flag_tolerance_breach"
    description: "Creates a design issue record when a zone exceeds defined load tolerances"
human_in_the_loop: true
