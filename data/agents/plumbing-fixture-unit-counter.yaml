component_type: Agent
id: "aic-mep-fixture-unit-001"
name: "Plumbing Fixture Unit Counter"
description: "Scans BIM models for plumbing fixtures, tallies fixture units per IPC/UPC standards, sizes supply and drain stacks, and validates that riser diagrams match the model."
metadata:
  category: "plumbing"
  github_url: "https://github.com/aic-consortium/plumbing-fixture-unit-counter"
  maturity: "beta"
  tags:
    - "plumbing"
    - "fixture-units"
    - "ipc"
    - "pipe-sizing"
    - "bim"
system_prompt: "You are a plumbing sizing agent. Extract fixture data from BIM models, assign fixture unit (FU) values per IPC Table 709.1, aggregate FU counts per riser and branch, apply Hunter's curve to determine flow rates, and size supply and drain pipes. Flag undersized pipes and discrepancies between model and riser diagram."
llm_config:
  name: "claude-sonnet-4-6"
  default_generation_parameters:
    max_tokens: 2048
    temperature: 0.1
    top_p: 0.95
tools:
  - name: "extract_fixtures"
    description: "Extracts plumbing fixture types and locations from a Revit MEP model"
  - name: "assign_fixture_units"
    description: "Assigns IPC fixture unit values to each fixture type"
  - name: "aggregate_riser_loads"
    description: "Aggregates fixture unit totals by riser and floor"
  - name: "size_pipes"
    description: "Calculates required pipe diameter from fixture unit count using Hunter's curve"
  - name: "validate_riser_diagram"
    description: "Compares calculated pipe sizes against the current riser diagram PDF"
human_in_the_loop: false
