id: T2-CATALOG-API
tier: 2
title: Acme parts catalog REST API (synthetic)
source: invented Acme catalog API served by the offline mock
auth: api_key_header
transport: stdio
provides_modalities: [spec]
pass_thresholds:
  d1_pass: true
  d2_pct: 90
  d4_pct: 80
scoring_notes: >
  Same structure as the implemented source case: nine source-style checks (tool_exists_lookup through
  auth_failure) plus the ten generic behaviour checks (bh_ lines, linked through check_kind) so that a lenient
  server cannot score full marks. The mock rejects the native attribute parameter, caps the page size at 50
  and returns a legacy error envelope past the result window (200). Legacy HTTP+SSE is not covered.
x-upstream:
  a:
    datasets: [catalog]
    auth: { header: X-Api-Key, mode: '401' }
    maxPageSize: 50
    ceiling: 200
    seed: 1
x-env:
  baseUrl: ACME_BASE_URL
  apiKey: ACME_API_KEY
