openapi: 3.0.3
info:
  title: Acme Widgets API
  version: "0.1.0"
paths:
  /widgets:
    get:
      operationId: listWidgets
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: size
          in: query
          schema:
            type: integer
            maximum: 25
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
  /external:
    get:
      operationId: listExternal
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "https://schemas.example/other.yaml#/Thing"
  /shapes:
    get:
      operationId: listShapes
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/Widget"
                    - $ref: "#/components/schemas/Gizmo"
  /gadgets:
    get:
      operationId: listGadgets
      responses:
        "204":
          description: nothing
  /gizmos/{gizmoId}/widgets:
    get:
      operationId: listGizmoWidgets
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
components:
  schemas:
    Widget:
      type: object
      properties:
        widgetId:
          type: string
        name:
          type: string
    Gizmo:
      type: object
      properties:
        gizmoId:
          type: string
