openapi: 3.0.3
info:
  title: Acme Parts API
  version: "1.0.0"
  description: Invented parts catalogue used only as a test fixture.
servers:
  - url: https://api.acme.example/v1
security:
  - AcmeKeyAuth: []
paths:
  /parts:
    get:
      operationId: listParts
      summary: Search and list parts
      parameters:
        - name: q
          in: query
          description: Free text query
          schema:
            type: string
          example: bolt
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - $ref: "#/components/parameters/AcmeKeyHeader"
      responses:
        "200":
          description: A page of parts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartPage"
    post:
      operationId: createPart
      summary: Create a part
      responses:
        "201":
          description: Created
  /parts/{partId}:
    parameters:
      - name: partId
        in: path
        required: true
        description: Part code
        schema:
          type: string
    get:
      operationId: getPartUsingGET
      summary: Fetch one part
      responses:
        "200":
          description: The part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"
    delete:
      operationId: deletePart
      summary: Delete a part
      responses:
        "204":
          description: Deleted
components:
  securitySchemes:
    AcmeKeyAuth:
      type: apiKey
      in: header
      name: X-Acme-Key
  parameters:
    AcmeKeyHeader:
      name: X-Acme-Key
      in: header
      required: false
      schema:
        type: string
      example: sample-key-0000
  schemas:
    PartPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Part"
        total:
          type: integer
    Part:
      type: object
      properties:
        partId:
          type: string
          description: Stable part code
        name:
          type: string
          description: Display name
        category:
          type: string
          description: Part group
        price:
          type: number
        inStock:
          type: boolean
        status:
          type: string
          enum: [active, retired]
        features:
          type: array
          description: Technical features as code and value entries
          items:
            $ref: "#/components/schemas/Feature"
        manufacturer:
          type: string
        color:
          type: string
        material:
          type: string
        weightKg:
          type: number
        lengthMm:
          type: number
        widthMm:
          type: number
        heightMm:
          type: number
        warrantyMonths:
          type: integer
        shelfLife:
          type: integer
        packSize:
          type: integer
        barcode:
          type: string
        origin:
          type: string
        notes:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string
        supplierRef:
          type: string
        leadTimeDays:
          type: integer
        currency:
          type: string
    Feature:
      type: object
      properties:
        featureCode:
          type: string
        featureValue:
          type: string
        unit:
          type: string
